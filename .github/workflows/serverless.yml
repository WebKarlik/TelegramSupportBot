# Автодеплой версии для Telegram Serverless (папки tgcloud/ и webapp/).
# Нужны секреты в Settings → Secrets and variables → Actions:
#   TGCLOUD_TOKEN   — BotFather → бот → Serverless → CLI Access → Access token
#   SUPERADMIN_IDS  — ваш Telegram ID (через запятую, если несколько)
# Необязательные переменные (вкладка Variables): SUPPORT_NAME, WEBAPP_URL.
# Личные настройки в репозиторий не попадают: они подставляются только при деплое.
# Без TGCLOUD_TOKEN workflow просто пропускается.
name: Telegram Serverless

on:
  push:
    branches: [main]
    paths: ["tgcloud/**", "webapp/**", "scripts/**", "tgcloud.jsonc", "package*.json", ".github/workflows/serverless.yml"]
  workflow_dispatch:

concurrency: serverless-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      SUPERADMIN_IDS: ${{ secrets.SUPERADMIN_IDS }}
      SUPPORT_NAME: ${{ vars.SUPPORT_NAME }}
      WEBAPP_URL: ${{ vars.WEBAPP_URL }}
    steps:
      - name: Проверка токена
        if: env.TGCLOUD_TOKEN == ''
        run: echo "::notice::Секрет TGCLOUD_TOKEN не задан — деплой в Telegram Serverless пропущен."
      - uses: actions/checkout@v4
        if: env.TGCLOUD_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.TGCLOUD_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.TGCLOUD_TOKEN != ''
        run: npm ci
      - if: env.TGCLOUD_TOKEN != ''
        run: npm test
      - name: Деплой кода и мини-приложения
        if: env.TGCLOUD_TOKEN != ''
        run: npm run deploy
      - name: Безопасные изменения схемы БД (новые таблицы/столбцы)
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud migrate --safe
