# Автодеплой версии для Telegram Serverless (папки tgcloud/ и webapp/).
# Нужны секреты в Settings → Secrets and variables → Actions:
#   TGCLOUD_TOKEN   — BotFather → бот → Serverless → CLI Access → Access token
#   SUPERADMIN_IDS  — ваш Telegram ID (через запятую, если несколько)
# Необязательные переменные (вкладка Variables): SUPPORT_NAME, WEBAPP_URL.
# Личные настройки в репозиторий не попадают: они подставляются только при деплое.
# Без TGCLOUD_TOKEN workflow просто пропускается.
name: Telegram Serverless

on:
  push:
    branches: [main]
    paths: ["tgcloud/**", "webapp/**", "scripts/**", "tgcloud.jsonc", "package*.json", ".github/workflows/serverless.yml"]
  workflow_dispatch:

concurrency: serverless-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
      SUPERADMIN_IDS: ${{ secrets.SUPERADMIN_IDS }}
      SUPPORT_NAME: ${{ vars.SUPPORT_NAME }}
      WEBAPP_URL: ${{ vars.WEBAPP_URL }}
    steps:
      - name: Проверка секретов
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            msg="Секрет TGCLOUD_TOKEN не найден. Добавьте его в Settings → Secrets and variables → Actions → вкладка Secrets → Repository secrets (не Variables и не Environment)."
            # При ручном запуске это ошибка, при обычном push — просто пропуск (бот может работать на сервере).
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::notice::$msg Деплой пропущен."
            exit 0
          fi
          if [ -z "$SUPERADMIN_IDS" ]; then
            echo "::error::Секрет SUPERADMIN_IDS не найден (ваш Telegram ID). Добавьте его там же, где TGCLOUD_TOKEN."
            exit 1
          fi
          echo "Секреты на месте: TGCLOUD_TOKEN и SUPERADMIN_IDS."
      - uses: actions/checkout@v4
        if: env.TGCLOUD_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.TGCLOUD_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - if: env.TGCLOUD_TOKEN != ''
        run: npm ci
      - if: env.TGCLOUD_TOKEN != ''
        run: npm test
      # Каждый запуск CI начинается с чистой машины без .tgcloud/ — подтягиваем из облака
      # номер текущей версии, чтобы push знал, от чего считать изменения.
      - name: Состояние бота в облаке
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud fetch
      - name: Деплой кода и мини-приложения
        if: env.TGCLOUD_TOKEN != ''
        run: npm run deploy
      - name: Безопасные изменения схемы БД (новые таблицы/столбцы)
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud migrate --safe
      - name: Webhook → Serverless (направить сообщения бота в облако и показать состояние)
        if: env.TGCLOUD_TOKEN != ''
        run: npx tgcloud webhook sync
